<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Los Pinos · Sistema de ventas (demo)</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
/* Concepto: el cartel de la confitería. Banda grafito con puntos blancos, rosa de marca como fondo y acento; el rosa oscuro se reserva para acciones y texto. */
:root{
  --bg:#FAF4F6; --surface:#FFFFFF; --surface2:#F5E9EE; --ink:#2A2D2F; --muted:#686D6F; --line:#E8D6DE;
  --brand:#D76F92; --brand-soft:#FBE3EC; --brand-ink:#A8305F;
  --accent:#B83A70; --on-accent:#FFFFFF;
  --graf:#3A3E41; --graf2:#606465; --on-graf:#FFFFFF;
  --ok:#1D7348; --warn:#8F5600; --bad:#B3261E; --ok-soft:#DDF0E5; --warn-soft:#F6E6C8; --bad-soft:#F8DEDB;
  --c1:#B83A70; --c2:#606465;
  --display:"Archivo","Arial Black",system-ui,sans-serif; --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1D1E; --surface:#26292B; --surface2:#303436; --ink:#F3EEF0; --muted:#A9AFB1; --line:#3A3F42;
  --brand:#E07CA0; --brand-soft:#42303A; --brand-ink:#F19DBB; --accent:#E889AB; --on-accent:#2A0F1B;
  --graf:#2F3335; --graf2:#8A9193;
  --ok:#5CC48F; --warn:#E5A24A; --bad:#F28B82; --ok-soft:#173326; --warn-soft:#3A2C14; --bad-soft:#40201E;
  --c1:#E889AB; --c2:#9AA1A3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1D1E; --surface:#26292B; --surface2:#303436; --ink:#F3EEF0; --muted:#A9AFB1; --line:#3A3F42;
  --brand:#E07CA0; --brand-soft:#42303A; --brand-ink:#F19DBB; --accent:#E889AB; --on-accent:#2A0F1B;
  --graf:#2F3335; --graf2:#8A9193;
  --ok:#5CC48F; --warn:#E5A24A; --bad:#F28B82; --ok-soft:#173326; --warn-soft:#3A2C14; --bad-soft:#40201E;
  --c1:#E889AB; --c2:#9AA1A3; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);padding-block:0 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1200px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15;letter-spacing:-.01em}
h2{font-size:1.3rem} h3{font-size:1.05rem}
/* cartel */
.sign{margin:14px 0 0;border-radius:14px;overflow:hidden;background-color:var(--brand);padding:26px 0;position:relative;
  background-image:radial-gradient(circle at 12% 40%,rgba(255,255,255,.22) 0 14px,transparent 15px),radial-gradient(circle at 34% 70%,rgba(255,255,255,.18) 0 10px,transparent 11px),radial-gradient(circle at 62% 30%,rgba(255,255,255,.2) 0 12px,transparent 13px),radial-gradient(circle at 86% 65%,rgba(255,255,255,.18) 0 16px,transparent 17px)}
.band{background:var(--graf);color:var(--on-graf);position:relative;padding:12px 0}
.band::before,.band::after{content:"";position:absolute;left:0;right:0;height:10px;background:radial-gradient(circle,#fff 2.4px,transparent 3px) 0 center/16px 10px repeat-x}
.band::before{top:2px} .band::after{bottom:2px}
.band-in{padding-left:18px;padding-right:18px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding-block:10px}
.roundel{width:92px;height:auto;margin:-26px 0;position:relative;z-index:2;filter:drop-shadow(0 3px 5px rgba(0,0,0,.35))}
.ttl{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.ttl small{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:#F6CDDB}
.ttl b{font:800 1.9rem/1.05 var(--display);letter-spacing:-.02em}
.who{display:flex;gap:10px;flex-wrap:wrap}
.who label{display:flex;flex-direction:column;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:#D8DCDD;gap:3px}
.who select{background:#2B2E30;color:#fff;border:1px solid #6B7072;border-radius:8px;padding:8px 10px;font-size:.95rem;text-transform:none;letter-spacing:0}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:2px solid var(--line);margin:18px 0 18px}
.tabs button{border:0;background:transparent;padding:12px 18px;font:700 .98rem var(--display);color:var(--muted);white-space:nowrap;border-bottom:4px solid transparent;margin-bottom:-2px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
.tabs .cnt{display:inline-block;background:var(--bad);color:#fff;border-radius:999px;font:700 .72rem var(--body);padding:1px 7px;margin-left:6px}
/* POS */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.cats button{white-space:nowrap;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:999px;font-weight:600}
.cats button[aria-pressed="true"]{background:var(--graf);color:#fff;border-color:var(--graf)}
.search{width:100%;margin-bottom:12px}
input[type=search],input[type=text],input[inputmode],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.prod{display:flex;flex-direction:column;justify-content:space-between;gap:12px;text-align:left;min-height:104px;padding:13px;border:1px solid var(--line);border-top:4px solid var(--brand);background:var(--surface);border-radius:10px}
.prod:hover{border-color:var(--accent);border-top-color:var(--accent)}
.prod:active{transform:translateY(1px)}
.prod .n{font-weight:700;line-height:1.2}
.prod .p{display:flex;justify-content:space-between;align-items:baseline;color:var(--muted);font-size:.88rem;gap:6px}
.prod .p b{color:var(--ink);font:700 1.02rem var(--display)}
.kg{font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line);padding:1px 6px;border-radius:4px;white-space:nowrap}
.side{display:flex;flex-direction:column;gap:16px;min-width:0;position:sticky;top:12px}
.ticket,.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.ticket{display:flex;flex-direction:column;gap:12px}
.ticket-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lines{display:flex;flex-direction:column;min-height:60px}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.line .q{color:var(--muted);font-size:.86rem}
.step{display:inline-flex;gap:2px}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:30px;height:30px;line-height:1;padding:0}
.empty{color:var(--muted);padding:12px 0}
.total{display:flex;justify-content:space-between;align-items:baseline;font:800 2rem/1 var(--display)}
.total span:first-child{font:600 .92rem var(--body);color:var(--muted)}
.pay{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pay button{padding:8px 2px;font-size:.88rem;white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-weight:700}
.pay button[aria-pressed="true"]{border-color:var(--accent);background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--accent);color:var(--brand-ink)}
.chk{display:flex;align-items:center;gap:8px;font-size:.95rem}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.cta{width:100%;padding:15px;border:0;border-radius:10px;background:var(--accent);color:var(--on-accent);font:800 1.08rem var(--display)}
.cta:disabled{opacity:.45;cursor:not-allowed}
.ghost{border:1px solid var(--line);background:transparent;border-radius:8px;padding:9px 14px;font-weight:700}
.mp{background:var(--graf);color:#fff;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.mp h3{font-size:.98rem;display:flex;justify-content:space-between;gap:8px;align-items:center}
.mp .tag2{font:600 .68rem var(--body);letter-spacing:.06em;text-transform:uppercase;background:#F6CDDB;color:#3A3E41;border-radius:4px;padding:2px 6px}
.mp .it{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;border-top:1px solid #555a5c;padding-top:7px}
.mp .it small{color:#C6CBCC}
.mp .bal{display:flex;justify-content:space-between;border-top:1px solid #6B7072;padding-top:8px;font-weight:700}
.mp .fut{font-size:.78rem;color:#C6CBCC}
.sheet-bg{position:fixed;inset:0;background:rgba(15,17,18,.6);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.sheet{background:var(--surface);border-radius:14px;padding:18px;width:min(400px,100%);max-height:calc(100% - 20px);overflow:auto;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.disp{background:var(--graf);color:#fff;border-radius:10px;padding:12px 16px;text-align:right}
.disp small{display:block;color:#C6CBCC;font-size:.8rem}
.disp b{font:800 2.2rem/1.1 var(--display)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{padding:15px 0;font:700 1.25rem var(--display);border:1px solid var(--line);background:var(--surface);border-radius:10px}
.keys button:active{background:var(--brand-soft)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{padding:11px 4px;border:1px solid var(--line);background:var(--brand-soft);color:var(--brand-ink);border-radius:8px;font-weight:700}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:.85rem;font-weight:600}
.fld small{color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mobbar{display:none}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;margin-top:16px}
.note{color:var(--muted);font-size:.9rem}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:.8rem;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.mute{background:var(--surface2);color:var(--muted)}
.fut{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;color:var(--muted);font-size:.88rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--brand);border-radius:10px;padding:13px 16px}
.kpi .k{color:var(--muted);font-size:.88rem}
.kpi .v{font:800 1.7rem/1.2 var(--display)}
.kpi .s{font-size:.82rem;color:var(--muted)}
.range{display:inline-flex;gap:4px;background:var(--surface2);padding:3px;border-radius:9px}
.range button{border:0;background:transparent;padding:7px 13px;border-radius:6px;font-weight:700;color:var(--muted)}
.range button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
table{width:100%;border-collapse:collapse}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;text-align:left;padding:0 8px 8px 0;white-space:nowrap}
td{padding:9px 8px 9px 0;border-top:1px solid var(--line);vertical-align:middle}
th.r,td.r{text-align:right;padding-right:0}
.tw{overflow-x:auto}
.bars{display:grid;gap:6px;align-items:end;height:190px;padding-top:20px}
.bars.d7{grid-template-columns:repeat(7,1fr);gap:8px}
.bars.h{grid-template-columns:repeat(14,1fr);gap:4px}
.bar{display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-width:0;text-align:center}
.bar .stack{display:flex;flex-direction:column;justify-content:flex-end;flex:1}
.bar .stack i{display:block;width:100%;border-radius:3px 3px 0 0}
.bar .pair{display:flex;gap:2px;align-items:flex-end;flex:1}
.bar .pair i{display:block;flex:1;border-radius:3px 3px 0 0}
.bar .val{font-size:.72rem;color:var(--muted);height:18px}
.bar .d{font-size:.78rem;color:var(--muted);margin-top:6px;white-space:nowrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.86rem;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.hbar{display:grid;grid-template-columns:104px minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 0}
.hbar .t{height:10px;background:var(--surface2);border-radius:5px;overflow:hidden}
.hbar .t i{display:block;height:100%;background:var(--accent);border-radius:5px}
.alert{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:11px 14px;font-weight:600;margin-bottom:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.alert button{border:0;background:transparent;text-decoration:underline;font-weight:700;color:inherit}
.blind{max-width:640px;margin:0 auto}
.blind .card{display:flex;flex-direction:column;gap:14px}
.blind .hero{background:var(--graf);color:#fff;border-radius:12px;padding:16px 18px}
.blind .hero p{margin:6px 0 0;color:#D8DCDD;font-size:.95rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--graf);color:#fff;padding:12px 18px;border-radius:10px;font-weight:700;z-index:40;max-width:calc(100% - 32px);border-left:5px solid var(--brand)}
.foot{margin-top:22px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:.86rem}
.main-col{min-width:0}
.form .frow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:end}
.ro{display:block;padding:10px 0;font:700 1.1rem var(--display);border-bottom:2px solid var(--line);min-height:44px}
.form .chips{margin-top:12px}
.factions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.factions .cta{width:auto;padding:13px 24px}
.code{display:block;font-weight:500;font-size:.76rem;color:var(--muted);margin-top:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700}
.chips button[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--accent);color:var(--brand-ink)}
.paid{display:flex;flex-direction:column;gap:8px;background:var(--surface2);border-radius:10px;padding:10px 12px}
.vuelto{display:flex;justify-content:space-between;align-items:baseline}
.vuelto b{font:800 1.4rem var(--display);color:var(--ok)}
.line{grid-template-columns:minmax(0,1fr) auto}
.line.editing{background:var(--brand-soft);margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:8px}
.lact{grid-column:1/-1;display:flex;gap:6px}
.lact button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 11px;font-size:.84rem;font-weight:600}
.lact .del{color:var(--bad)}
.srow{margin-bottom:10px}.srow .search{margin:0;width:100%}
.gh{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;font:700 1rem var(--display);margin-top:8px;padding-bottom:6px;border-bottom:2px solid var(--brand)}
.tc{display:inline-block;background:var(--surface2);color:var(--muted);border-radius:999px;font:600 .72rem var(--body);padding:1px 7px;margin-left:4px}
.cats button[aria-pressed="true"] .tc{background:#ffffff33;color:#fff}
.prod{padding:0;gap:0;min-height:0;overflow:hidden;justify-content:flex-start}
.prod .im{display:flex;align-items:center;justify-content:center;height:92px;background:var(--brand-soft);overflow:hidden}
.prod .im svg{width:60px;height:60px}
.prod .im img{width:100%;height:100%;object-fit:cover}
.prod .bd{display:flex;flex-direction:column;justify-content:space-between;gap:10px;padding:11px 13px 13px;flex:1}
.thumb{display:inline-flex;width:46px;height:46px;border-radius:8px;background:var(--brand-soft);align-items:center;justify-content:center;overflow:hidden;flex:none}
.thumb svg{width:70%;height:70%}.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.big{width:76px;height:76px}
.th{display:inline-flex;width:38px;height:38px;border-radius:8px;background:var(--brand-soft);align-items:center;justify-content:center;overflow:hidden;flex:none}
.th svg{width:72%;height:72%}.th img{width:100%;height:100%;object-fit:cover}
.lname{display:flex;gap:10px;align-items:center;min-width:0}
.pwrap{display:flex;gap:10px;align-items:center}.pwrap input{flex:1}
.photo{display:flex;gap:12px;align-items:center}.photo-act{display:flex;flex-direction:column;gap:8px;align-items:flex-start;min-width:0}
.photo-act input[type=file]{max-width:100%;font-size:.86rem}
.tools{display:flex;gap:8px 18px;flex-wrap:wrap;align-items:center;justify-content:flex-end;padding-top:12px;color:var(--muted);font-size:.84rem}
.tools .tl{display:flex;align-items:center;gap:8px}
.tools .range button{padding:5px 11px;font-size:.84rem}
.embed .tools{display:none}
.tabrow{display:flex;flex-direction:column-reverse}
.tabrow .tabs{flex:1;min-width:0}
.locked .tabs,.locked #app{display:none}
.locked .who{display:none}
.usr{display:flex;align-items:center;gap:8px;color:#fff;align-self:flex-end}
.usr .lo{padding:6px 12px;color:#fff;border-color:#8a8f91}
.fixed{display:flex;flex-direction:column;gap:3px;color:#D8DCDD}
.fixed small{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
.fixed b{color:#fff;font-size:1rem;padding:8px 0}
.role{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.r-empleado{background:#DDEFE3;color:#1F5A37;border-color:#B4D8C2}
.r-supervisor{background:#FFF0CC;color:#7A5200;border-color:#EBD08A}
.r-admin{background:var(--brand-soft);color:var(--brand-ink);border-color:#EBB6C9}
[data-theme=dark] .r-empleado,[data-theme=dark] .r-supervisor,[data-theme=dark] .r-admin{background:#33383A;color:#F1E6EA;border-color:#555B5D}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .r-empleado,:root:not([data-theme=light]) .r-supervisor,:root:not([data-theme=light]) .r-admin{background:#33383A;color:#F1E6EA;border-color:#555B5D}}
#login{display:flex;justify-content:center;padding:22px 0}
#login[hidden]{display:none}
.lg{width:100%;max-width:440px;display:flex;flex-direction:column;gap:12px}
.lg label{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:.9rem}
.lg input{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-size:1rem}
.lgerr{color:#B3261E;min-height:1.2em;font-size:.9rem;font-weight:600}
.perm{display:grid;gap:7px;font-size:.88rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.demo summary{cursor:pointer;font-weight:600;font-size:.9rem}
.accs{display:grid;gap:6px;margin-top:10px}
.acc{display:flex;align-items:center;gap:8px;flex-wrap:wrap;text-align:left;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer}
.acc small{margin-left:auto;color:var(--muted)}
.framed .sign,.framed .tabs,.framed #app{display:none}
#frame{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 0}
#frame[hidden]{display:none}
.device{background:#15181a;border-radius:30px;padding:12px;box-shadow:0 8px 30px rgba(0,0,0,.28);max-width:100%}
.device iframe{display:block;border:0;border-radius:20px;background:var(--bg);width:100%}
@media (max-width:900px){
  .pos{grid-template-columns:minmax(0,1fr)}
  .side{position:static}
  .mobbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;justify-content:space-between;align-items:center;gap:10px;background:var(--graf);color:#fff;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .mobbar b{font:800 1.25rem var(--display)}

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function seedData(){
  var r=rng(42),sales=[],closings=[],now=Date.now(),n0=0,stock={centro:{},malvinas:{}};
  DEFAULT_PRODUCTS.forEach(function(p){Object.keys(LOCALES).forEach(function(lk){stock[lk][p.id]=p.unit==="kg"?Math.round((18+r()*55)*10)/10:Math.round(28+r()*90)})});
  stock.centro.ch=4.5;stock.malvinas.ml=9;stock.malvinas.cl=14;stock.centro.pz=12;
  for(var d=6;d>=0;d--){
    Object.keys(LOCALES).forEach(function(lk){
      var emps=LOCALES[lk].emps;
      var count=d===0?Math.round(16+r()*8):Math.round((55+r()*30)*(lk==="centro"?1:0.78));
      var day=[];
      for(var i=0;i<count;i++){
        var from=startOfDay(d)+7*3600000,to=d===0?Math.max(from+1800000,Math.min(now-60000,startOfDay(0)+20*3600000)):startOfDay(d)+20*3600000;
        var ts=Math.round(from+r()*(to-from));
        var items=[],k=1+Math.floor(r()*3.4);
        for(var j=0;j<k;j++){
          var p=DEFAULT_PRODUCTS[Math.floor(Math.pow(r(),1.7)*DEFAULT_PRODUCTS.length)];
          var qty=p.unit==="kg"?[0.25,0.35,0.5,0.5,1,1.5][Math.floor(r()*6)]:1+Math.floor(r()*r()*5);
          items.push({pid:p.id,name:p.name,unit:p.unit,qty:qty,price:p.price,amount:Math.round(p.price*qty)});
        }
        var roll=r(),pay=roll<0.45?"ef":roll<0.70?"de":roll<0.88?"tr":"qr";
        var emp=new Date(ts).getHours()<14?emps[0]:emps[1];
        day.push({id:"s"+(n0++),ts:ts,local:lk,emp:emp,items:items,total:items.reduce(function(a,b){return a+b.amount},0),pay:pay,fc:r()<0.08,facturada:d>1?true:(d===1?r()<0.5:false)});
      }
      day.sort(function(a,b){return a.ts-b.ts});
      sales=sales.concat(day);
      if(d>0){
        emps.forEach(function(emp,ei){
          var exp={ef:0,de:0,tr:0,qr:0};
          day.filter(function(s){return s.emp===emp}).forEach(function(s){exp[s.pay]+=s.total});
          var fondo=10000;exp.ef+=fondo;
          var cnt={ef:exp.ef,de:exp.de,tr:exp.tr,qr:exp.qr},x=r();
          if(x<0.28)cnt.ef-=Math.round((200+r()*1800)/100)*100;
          else if(x<0.40)cnt.ef+=Math.round((100+r()*900)/100)*100;
          var diff=0;PAYS.forEach(function(p){diff+=cnt[p[0]]-exp[p[0]]});
          closings.push({id:"c"+(n0++),ts:startOfDay(d)+(ei?20.5:14.2)*3600000,local:lk,emp:emp,fondo:fondo,exp:exp,cnt:cnt,diff:diff,obs:"",rev:d>1});
        });
      }
    });
  }
  return {products:DEFAULT_PRODUCTS.map(function(p){return Object.assign({},p)}),sales:[],closings:[],mpFeed:[],mpN:0,stock:stock,fact:{ef:false,de:true,tr:false,qr:true,_v2:1},n:0,z1:1};
}
function load(){

  if(!S.products)S.products=DEFAULT_PRODUCTS.map(function(p){return Object.assign({},p)});
  S.sales.forEach(function(x){if(x.pay==="tr"&&x.acr===undefined)x.acr={ts:x.ts+60000,by:x.emp,auto:true}});
  if(!S.z1){S.sales=[];S.closings=[];S.mpFeed=[];S.mpN=0;S.n=0;if(S.fcfg)S.fcfg.last=0;S.z1=1;save()}
  if(!S.priceLog)S.priceLog=[];
  if(S.fact&&!S.fact._v2){S.fact.tr=false;S.fact._v2=1}
  if(!S.mpFeed){var nm=["M. Gómez","L. Pérez","C. Díaz","A. Ruiz","S. Torres","J. Álvarez","P. Sosa","V. Molina"];S.mpFeed=S.sales.filter(function(x){return x.pay==="tr"&&x.acr}).slice(-60).map(function(x,i){return {id:"m"+i,ts:x.ts+60000,amount:x.total,payer:nm[i%nm.length],sid:x.id}});S.mpN=S.mpFeed.length}
  setProducts();mem=S;
}

/* formulario de carga: alta (agregar), modificación (editar) y baja (eliminar) de líneas */
function findProd(txt){
  var t=(txt||"").trim().toLowerCase();if(!t)return null;
  var num=/^#?\d+$/.test(t)?parseInt(t.replace("#",""),10):null;
  var f=PRODUCTS.filter(function(p){return p.name.toLowerCase()===t||(num!==null&&p.code===num)});
  if(f.length)return f[0];
  var g=PRODUCTS.filter(function(p){return p.name.toLowerCase().indexOf(t)===0});
  return g.length===1?g[0]:null;
}
function parseQty(str,unit){
  var m=/^\s*([0-9]+(?:[.,][0-9]+)?)\s*(kg|gr|g|u)?\s*$/i.exec(str||"");if(!m)return NaN;
  var n=parseFloat(m[1].replace(",",".")),suf=(m[2]||"").toLowerCase();
  if(unit==="kg"){if(suf==="g"||suf==="gr")n=n/1000;else if(!suf&&n>=50&&m[1].indexOf(",")<0&&m[1].indexOf(".")<0)n=n/1000;return Math.round(n*1000)/1000}
  return Math.round(n);
}
function syncForm(){

  var ql=$("f-qlbl"),pr=$("f-price"),sb=$("f-sub"),qk=$("f-quick");if(!ql)return;
  var th=$("f-thumb");if(th)th.innerHTML=p?pimg(p):"";
  if(!p){ql.textContent="Peso o cantidad";pr.textContent="—";sb.textContent="—";qk.innerHTML='<span class="hint">Tocá un producto y después el peso: se agrega solo.</span>';return}
  ql.textContent=p.unit==="kg"?"Peso (kg)":"Cantidad (u)";
  $("f-qty").placeholder=p.unit==="kg"?"0,350 o 350 g":"1";
  pr.textContent=money(p.price)+(p.unit==="kg"?" /kg":" c/u");
  var q=parseQty($("f-qty").value,p.unit);
  sb.textContent=q>0?money(Math.round(p.price*q)):"—";
  qk.innerHTML=(p.unit==="kg"?[["100 g","0.1"],["250 g","0.25"],["500 g","0.5"],["750 g","0.75"],["1 kg","1"],["1,5 kg","1.5"],["2 kg","2"]]:[["+1","1"],["+3","3"],["+½ docena","6"],["+Docena","12"]]).map(function(c){return '<button data-a="fq" data-v="'+c[1]+'">'+c[0]+'</button>'}).join("");
}
function resetForm(){UI.edit=null;UI.sel=null;$("f-prod").value="";$("f-qty").value="";$("ftitle").textContent="Cargar producto";$("f-ok").textContent="Agregar al ticket";$("f-cancel").hidden=true;syncForm()}
function formAdd(){
  var p=UI.sel?PBY[UI.sel]:findProd($("f-prod").value);
  if(!p){toast("Elegí un producto de la lista");$("f-prod").focus();return}
  var q=parseQty($("f-qty").value,p.unit);
  if(!(q>0)){toast(p.unit==="kg"?"Escribí el peso, por ejemplo 0,350 o 350 g":"Escribí la cantidad");$("f-qty").focus();return}
  var line={pid:p.id,name:p.name,unit:p.unit,qty:q,price:p.price,amount:Math.round(p.price*q)};
  var edit=UI.edit!==null&&UI.cart[UI.edit];
  if(edit){UI.cart[UI.edit]=line;toast("Línea modificada")}else UI.cart.push(line);
  resetForm();renderTicket();$("f-prod").focus();
}
function startEdit(i){

  UI.edit=i;UI.sel=l.pid;$("f-prod").value=l.name;$("f-qty").value=String(l.qty).replace(".",",");
  $("ftitle").textContent="Modificar línea";$("f-ok").textContent="Guardar cambios";$("f-cancel").hidden=false;
  syncForm();renderTicket();$("f-qty").focus();$("f-prod").scrollIntoView({block:"center",behavior:"smooth"});
}

function isPend(x){return x.pay==="tr"&&!x.acr}
function pendList(){return S.sales.filter(function(x){return x.local===UI.local&&isPend(x)}).sort(function(a,b){return a.ts-b.ts})}
function arrivedMap(){
  var used={},map={},l=pendList();
  S.mpFeed.filter(function(e){return !e.sid&&!!e.real===MPREAL()}).forEach(function(e){for(var i=0;i<l.length;i++){if(!used[l[i].id]&&l[i].total===e.amount){used[l[i].id]=1;map[l[i].id]=e.id;break}}});
  return map;
}

function mpRefreshReal(){

  var btn=document.querySelector('[data-a="mprefresh"]');if(btn){btn.disabled=true;btn.textContent="Actualizando…"}
  fetch("/api/mp-transfers?since="+encodeURIComponent(st.toISOString()),{headers:{"x-demo-key":mpKey()},cache:"no-store"}).then(function(r){
    if(r.status===401){try{localStorage.removeItem("lospinos-mpkey")}catch(e){}throw new Error("Clave incorrecta. Volvé a elegir Real para cargarla.")}
    if(r.status===404)throw new Error("No hay servidor conectado en esta dirección (solo en la versión de Netlify).");
    if(!r.ok)throw new Error("Mercado Pago no respondió. Probá de nuevo.");
    return r.json()}).then(function(d){
    var have={};S.mpFeed.forEach(function(e){if(e.mpid)have[e.mpid]=1});var nn=0;
    (d.items||[]).forEach(function(it){if(have[it.id])return;S.mpFeed.push({id:"m"+(S.mpN++),ts:Date.parse(it.ts),amount:it.amount,payer:"Operación …"+String(it.id).slice(-4),sid:null,real:true,mpid:it.id});nn++});

  }).catch(function(e){renderMP();toast(e.message||"No se pudo actualizar")});

function viewHoy(){
  var t0=startOfDay(0),now=Date.now(),hl=UI.hl||"todos";
  var inL=function(x){return hl==="todos"||x.local===hl};
  var td=S.sales.filter(function(x){return x.ts>=t0&&inL(x)});
  var tot=sum(td);
  var ySame=sum(S.sales.filter(function(x){return inL(x)&&x.ts>=startOfDay(1)&&x.ts<=startOfDay(1)+(now-t0)}));
  var yAll=sum(S.sales.filter(function(x){return inL(x)&&x.ts>=startOfDay(1)&&x.ts<t0}));
  var dlt=ySame?Math.round((tot-ySame)/ySame*100):null;
  var byP=groupBy(td,function(x){return x.pay});
  var pay=PAYS.map(function(p){var l=byP[p[0]]||[];return '<div class="oh-pay"><small>'+p[1]+'</small><b class="num">'+money(sum(l))+'</b><span>'+l.length+' venta'+(l.length===1?'':'s')+'</span></div>'}).join("");
  var byLE=groupBy(td,function(x){return x.local+"|"+x.emp});
  var emp=Object.keys(byLE).sort().map(function(k){var a=byLE[k],pp=k.split("|");
    var cl=S.closings.filter(function(c){return c.ts>=t0&&c.local===pp[0]&&c.emp===pp[1]})[0];
    var st=cl?(cl.diff===0?'<span class="pill ok">Cierre justo</span>':'<span class="pill '+(cl.diff>0?"warn":"bad")+'">'+(cl.diff>0?"Sobra ":"Falta ")+money(Math.abs(cl.diff))+'</span>'):'<span class="pill mute">Sin cerrar</span>';
    return '<div class="oh-row"><div><b>'+pp[1]+'</b><small>'+LOCALES[pp[0]].name.replace("Local ","")+' · '+a.length+' ventas · '+money(sum(a))+'</small></div><div class="oh-st">'+st+(cl&&!cl.rev?'<button class="ghost" data-a="rev" data-v="'+cl.id+'">Marcar revisado</button>':(cl?'<small>Revisado</small>':''))+'</div></div>'}).join("");
  var trs=td.filter(function(x){return x.pay==="tr"}),trPend=S.sales.filter(function(x){return inL(x)&&isPend(x)}).sort(function(a,b){return a.ts-b.ts});
  var trOk=trs.filter(function(x){return !!x.acr});
  var orphan=S.mpFeed.filter(function(e){return !e.sid&&!!e.real===MPREAL()&&e.ts>=t0});
  var am=arrivedMap();
  orphan=orphan.filter(function(e){return trPend.every(function(x){return am[x.id]!==e.id})});
  var pl=trPend.map(function(x){return '<div class="oh-row"><div><b class="num">'+money(x.total)+'</b><small>'+x.emp+' · '+hhmm(x.ts)+' · '+LOCALES[x.local].name.replace("Local ","")+(am[x.id]?' · <em class="ok2">ya llegó, falta acreditar</em>':' · esperando el pago')+'</small></div></div>'}).join("");
  var ol=orphan.map(function(e){return '<div class="oh-row"><div><b class="num">+'+money(e.amount)+'</b><small>'+hhmm(e.ts)+' · llegó plata sin venta cargada</small></div></div>'}).join("");
  var pf=pendFact(),low=lowStock();
  var obsL=S.sales.filter(function(x){return x.ts>=t0&&inL(x)&&x.obs}).sort(function(a,b){return b.ts-a.ts});
  var obsC=obsL.length?'<section class="oh-card"><h3>Observaciones de hoy</h3>'+obsL.map(function(x){return '<div class="oh-row"><div><b class="num">'+money(x.total)+' · '+payName(x.pay)+'</b><small>'+hhmm(x.ts)+' · '+x.emp+' · '+LOCALES[x.local].name.replace("Local ","")+'</small><small class="oh-ob">“'+String(x.obs.t).replace(/</g,"&lt;")+'” — '+x.obs.by+'</small></div></div>'}).join("")+'</section>':"";
  var alerts=[];
  var noCl=Object.keys(byLE).filter(function(k){var pp=k.split("|");return !S.closings.some(function(c){return c.ts>=t0&&c.local===pp[0]&&c.emp===pp[1]})}).length;
  if(trPend.length)alerts.push('<b>'+trPend.length+'</b> transferencia'+(trPend.length===1?'':'s')+' sin acreditar ('+money(sum(trPend))+')');
  if(orphan.length)alerts.push('<b>'+orphan.length+'</b> ingreso'+(orphan.length===1?'':'s')+' de Mercado Pago sin venta cargada');
  if(noCl)alerts.push('<b>'+noCl+'</b> turno'+(noCl===1?'':'s')+' sin cierre de caja');
  if(obsL.length)alerts.push('<b>'+obsL.length+'</b> operación'+(obsL.length===1?'':'es')+' con observación del empleado');
  if(low.length)alerts.push('<b>'+low.length+'</b> producto'+(low.length===1?'':'s')+' con stock bajo');
  var al=alerts.length?'<div class="oh-alert"><b>Para revisar</b><ul>'+alerts.map(function(a){return '<li>'+a+'</li>'}).join("")+'</ul></div>':'<div class="oh-alert ok"><b>Todo en orden por ahora.</b></div>';
  var seg2=[["todos","Todos"]].concat(Object.keys(LOCALES).map(function(k){return [k,LOCALES[k].name.replace("Local ","")]})).map(function(o){return '<button data-a="hl" data-v="'+o[0]+'" aria-pressed="'+(hl===o[0])+'">'+o[1]+'</button>'}).join("");
  return '<div class="oh">'
   +'<div class="oh-top"><div><h2>Hoy en la panadería</h2><small>'+new Date().toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"})+'</small></div><div class="range" role="group" aria-label="Local">'+seg2+'</div></div>'
   +al
   +'<section class="oh-card oh-hero"><small>Vendido hoy</small><b class="num">'+money(tot)+'</b><span>'+td.length+' ventas'+(dlt===null?'':' · '+(dlt>=0?'▲ ':'▼ ')+Math.abs(dlt)+'% vs ayer a esta hora')+'</span><em>Ayer completo: '+money(yAll)+'</em></section>'
   +'<section class="oh-card"><h3>Cómo se cobró</h3><div class="oh-pays">'+pay+'</div></section>'
   +'<section class="oh-card"><h3>Cierres de caja de hoy</h3>'+(emp||'<div class="empty">Todavía no hay ventas hoy.</div>')+'</section>'
   +'<section class="oh-card"><h3>Transferencias</h3><div class="oh-pays two"><div class="oh-pay"><small>Acreditadas</small><b class="num">'+money(sum(trOk))+'</b><span>'+trOk.length+' hoy</span></div><div class="oh-pay"><small>Sin acreditar</small><b class="num">'+money(sum(trPend))+'</b><span>'+trPend.length+' venta'+(trPend.length===1?'':'s')+'</span></div></div>'+pl+ol+((pl||ol)?'':'<div class="empty">No hay transferencias pendientes ni ingresos sin venta.</div>')+'</section>'
   +obsC+'<section class="oh-card"><h3>Facturación</h3><div class="oh-row"><div><b>'+pf.length+' venta'+(pf.length===1?'':'s')+' para facturar</b><small>Importe '+money(sum(pf))+' · últimos 7 días</small></div><div class="oh-st"><button class="ghost" data-a="tab" data-v="fact">Ver lista</button></div></div></section>'
   +'<div class="oh-links"><button class="ghost" data-a="tab" data-v="dueno">Análisis completo</button><button class="ghost" data-a="tab" data-v="precios">Precios</button><button class="ghost" data-a="tab" data-v="stock">Stock</button></div>'
   +'</div>';
}

/* ---------- Dueño ---------- */
function viewDueno(){
  var from=UI.range==="hoy"?startOfDay(0):startOfDay(6);
  var ss=S.sales.filter(function(s){return s.ts>=from}),total=sum(ss);
  var cls=S.closings.filter(function(c){return c.ts>=from}),dsum=cls.reduce(function(a,c){return a+c.diff},0);
  var yday=sum(S.sales.filter(function(s){return s.ts>=startOfDay(1)&&s.ts<startOfDay(0)}));
  var tod=sum(S.sales.filter(function(s){return s.ts>=startOfDay(0)}));
  var kgPan=0;ss.forEach(function(s){s.items.forEach(function(l){if(l.unit==="kg"&&PBY[l.pid]&&PBY[l.pid].cat==="Panadería")kgPan+=l.qty})});
  var kpis='<div class="kpis"><div class="kpi"><div class="k">Ventas</div><div class="v num">'+money(total)+'</div><div class="s">'+(UI.range==="hoy"?"Ayer completo: "+money(yday):ss.length+" tickets")+'</div></div>'
   +'<div class="kpi"><div class="k">Tickets</div><div class="v num">'+ss.length+'</div><div class="s">Promedio '+money(ss.length?Math.round(total/ss.length):0)+'</div></div>'
   +'<div class="kpi"><div class="k">Pan vendido</div><div class="v num">'+kgPan.toLocaleString("es-AR",{maximumFractionDigits:1})+' kg</div><div class="s">Panadería por peso</div></div>'
   +'<div class="kpi"><div class="k">Diferencias de caja</div><div class="v num" style="color:'+dcolor(dsum)+'">'+(cls.length?signed(dsum):"Sin cierres")+'</div><div class="s">'+cls.length+' arqueo'+(cls.length===1?"":"s")+'</div></div></div>';
  // por hora hoy vs ayer
  var hrs=[],mx=1;
  for(var h=7;h<=20;h++){var a=sum(S.sales.filter(function(s){return s.ts>=startOfDay(0)+h*3600000&&s.ts<startOfDay(0)+(h+1)*3600000})),b=sum(S.sales.filter(function(s){return s.ts>=startOfDay(1)+h*3600000&&s.ts<startOfDay(1)+(h+1)*3600000}));hrs.push({h:h,a:a,b:b});mx=Math.max(mx,a,b)}
  var hbars=hrs.map(function(x){return '<div class="bar"><div class="pair"><i style="height:'+(x.b/mx*100)+'%;background:var(--c2);opacity:.55"></i><i style="height:'+(x.a/mx*100)+'%;background:var(--c1)"></i></div><div class="d">'+x.h+'</div></div>'}).join("");
  // 7 días
  var days=[],m7=1;
  for(var d=6;d>=0;d--){var f=startOfDay(d),t=f+86400000,day=S.sales.filter(function(s){return s.ts>=f&&s.ts<t});
    var a1=sum(day.filter(function(s){return s.local==="centro"})),b1=sum(day.filter(function(s){return s.local==="malvinas"}));
    days.push({a:a1,b:b1,lbl:dayTxt(f)});m7=Math.max(m7,a1+b1)}
  var bars=days.map(function(x){return '<div class="bar"><div class="val num">'+short(x.a+x.b)+'</div><div class="stack"><i style="height:'+(x.b/m7*100)+'%;background:var(--c2)"></i><i style="height:'+(x.a/m7*100)+'%;background:var(--c1)"></i></div><div class="d">'+x.lbl+'</div></div>'}).join("");
  // pagos
  var byP=groupBy(ss,function(s){return s.pay});
  var payRows=PAYS.map(function(p){var v=sum(byP[p[0]]||[]),pct=total?Math.round(v/total*100):0;return '<div class="hbar"><span>'+p[1]+'</span><span class="t"><i style="width:'+pct+'%"></i></span><span class="num">'+pct+'% · '+money(v)+'</span></div>'}).join("");
  // locales y empleados
  var byL=groupBy(ss,function(s){return s.local});
  var locRows=Object.keys(LOCALES).map(function(k){var a=byL[k]||[];return '<tr><td>'+LOCALES[k].name+'</td><td class="r num">'+a.length+'</td><td class="r num">'+money(sum(a))+'</td></tr>'}).join("");
  var byE=groupBy(ss,function(s){return s.local+"|"+s.emp});
  var empRows=Object.keys(byE).sort().map(function(k){var a=byE[k],pp=k.split("|");return '<tr><td>'+pp[1]+' <span class="note">'+LOCALES[pp[0]].name.replace("Local ","")+'</span></td><td class="r num">'+a.length+'</td><td class="r num">'+money(sum(a))+'</td></tr>'}).join("");
  // top
  var pm={};ss.forEach(function(s){s.items.forEach(function(l){var o=pm[l.pid]=pm[l.pid]||{name:l.name,unit:l.unit,qty:0,amt:0};o.qty+=l.qty;o.amt+=l.amount})});
  var topRows=Object.keys(pm).map(function(k){return pm[k]}).sort(function(a,b){return b.amt-a.amt}).slice(0,8).map(function(o){return '<tr><td>'+o.name+'</td><td class="r num">'+(o.unit==="kg"?o.qty.toLocaleString("es-AR",{maximumFractionDigits:1})+" kg":o.qty+" u")+'</td><td class="r num">'+money(o.amt)+'</td></tr>'}).join("");
  // arqueos
  var arq=S.closings.slice().sort(function(a,b){return b.ts-a.ts}).slice(0,8).map(function(c){
    var st=c.diff===0?'<span class="pill ok">Justo</span>':'<span class="pill '+(c.diff>0?"warn":"bad")+' num">'+(c.diff>0?"Sobra ":"Falta ")+money(Math.abs(c.diff))+'</span>';
    var det=PAYS.filter(function(p){return c.cnt[p[0]]!==c.exp[p[0]]}).map(function(p){return p[1]+" "+signed(c.cnt[p[0]]-c.exp[p[0]])}).join(", ");
    return '<tr><td>'+dayTxt(c.ts)+'</td><td>'+c.emp+' <span class="note">'+LOCALES[c.local].name.replace("Local ","")+'</span></td><td class="r">'+st+(det?'<div class="note num">'+det+'</div>':"")+(c.obs?'<div class="note">“'+c.obs+'”</div>':"")+'</td><td class="r">'+(c.rev?'<span class="note">Revisado</span>':'<button class="ghost" data-a="rev" data-v="'+c.id+'">Marcar revisado</button>')+'</td></tr>';
  }).join("");
  var low=lowStock();
  return '<div class="head"><h2>Tablero del dueño</h2><div class="range" role="group" aria-label="Período"><button data-a="range" data-v="hoy" aria-pressed="'+(UI.range==="hoy")+'">Hoy</button><button data-a="range" data-v="7" aria-pressed="'+(UI.range==="7")+'">Últimos 7 días</button></div></div>'
   +(low.length?'<div class="alert"><span>'+low.length+' producto'+(low.length===1?"":"s")+' con stock bajo en alguno de los locales.</span><button data-a="tab" data-v="stock">Ver stock</button></div>':"")
   +kpis
   +'<div class="cols"><section class="card"><h3>Ventas por hora: hoy contra ayer</h3><div class="bars h" role="img" aria-label="Ventas por hora, hoy y ayer">'+hbars+'</div><div class="legend"><span><i style="background:var(--c1)"></i>Hoy ('+money(tod)+')</span><span><i style="background:var(--c2);opacity:.55"></i>Ayer</span></div></section>'
   +'<section class="card"><h3>Últimos 7 días</h3><div class="bars d7" role="img" aria-label="Ventas de los últimos 7 días por local">'+bars+'</div><div class="legend"><span><i style="background:var(--c1)"></i>Local Centro</span><span><i style="background:var(--c2)"></i>Local Malvinas</span></div></section></div>'
   +'<div class="cols"><section class="card"><h3>Cómo cobran</h3><div style="margin-top:8px">'+payRows+'</div><h3 style="margin-top:18px">Por local</h3><div class="tw"><table style="margin-top:8px"><thead><tr><th>Local</th><th class="r">Tickets</th><th class="r">Ventas</th></tr></thead><tbody>'+locRows+'</tbody></table></div></section>'
   +'<section class="card"><h3>Lo que más se vende</h3><div class="tw"><table style="margin-top:8px"><thead><tr><th>Producto</th><th class="r">Cantidad</th><th class="r">Importe</th></tr></thead><tbody>'+topRows+'</tbody></table></div></section></div>'
   +'<div class="cols"><section class="card"><h3>Por empleado</h3><div class="tw"><table style="margin-top:8px"><thead><tr><th>Empleado</th><th class="r">Tickets</th><th class="r">Ventas</th></tr></thead><tbody>'+(empRows||'<tr><td colspan="3" class="empty">Sin ventas en el período.</td></tr>')+'</tbody></table></div></section>'
   +'<section class="card"><h3>Arqueos de caja</h3><div class="tw"><table style="margin-top:8px"><thead><tr><th>Día</th><th>Turno</th><th class="r">Resultado</th><th></th></tr></thead><tbody>'+arq+'</tbody></table></div></section></div>'
   +mpBlock()
   +'<div class="foot"><span>Esta demo empieza sin ventas y guarda los datos solo en este navegador.</span>'+(can("admin")?'<button class="ghost" data-a="reset">'+(UI.confirmReset?"Confirmar: borrar y reiniciar":"Reiniciar demo (borra las ventas)")+'</button>':"")+'</div>';
}

/* ---------- Facturación ---------- */
var PRICE_VIEW=function(){return PRODUCTS.filter(function(p){return UI.pcat==="Todas"||p.cat===UI.pcat})};
var PRICE_CHANGES=function(){var o=[];Object.keys(UI.pnew).forEach(function(id){var p=PBY[id],n=Math.round(parseFloat(String(UI.pnew[id]).replace(",",".")));if(p&&isFinite(n)&&n>0&&n!==p.price)o.push({p:p,n:n})});return o};
UI.pnew={};UI.pcat="Todas";UI.cview="prod";UI.mplast="";
function viewPrecios(){
  var co=["Todas"].concat(CATS).map(function(c){return '<option'+(c===UI.pcat?" selected":"")+'>'+c+'</option>'}).join("");
  return '<div class="card pboard"><div class="head"><div><h2>Tablero de precios</h2><div class="note">Cambiá precios en un solo lugar: la caja, el ticket, el margen y la facturación toman el precio nuevo. Las ventas ya hechas conservan el suyo.</div></div></div>'
   +'<div class="pctl"><div class="fld"><label for="pcat">Tipo de producto</label><select id="pcat">'+co+'</select></div><div class="fld"><label for="ppct">Aumento (%)</label><input id="ppct" class="num" inputmode="decimal" placeholder="Ej. 10"></div><button class="ghost" data-a="pctapply">Aplicar a lo que se ve</button><button class="ghost" data-a="pclear">Limpiar</button></div>'
   +'<div class="tw"><table class="ptab"><thead><tr><th>Producto</th><th>Se vende</th><th class="r">Precio actual</th><th class="r">Precio nuevo</th><th class="r">Cambio</th></tr></thead><tbody id="pbody"></tbody></table></div>'
   +'<div class="pfoot"><span id="pcount" class="note"></span><button class="cta" id="psave" data-a="psave">Guardar cambios</button></div></div>'
   +'<div class="card" style="margin-top:14px"><h3>Últimos cambios de precio</h3><div class="tw"><table style="margin-top:8px"><thead><tr><th>Fecha</th><th>Producto</th><th class="r">Antes</th><th class="r">Ahora</th><th>Quién</th></tr></thead><tbody id="plog"></tbody></table></div></div>';
}
function pdelta(p,v){var n=Math.round(parseFloat(String(v).replace(",",".")));if(!isFinite(n)||n<=0||n===p.price)return "—";var d=(n/p.price-1)*100;return (d>0?"+":"")+d.toFixed(1).replace(".",",")+" %"}

/* conciliación simulada con el reporte de Mercado Pago */
function mpReport(){
  var today=dayKey(Date.now());
  var mine=S.sales.filter(function(x){return dayKey(x.ts)===today&&x.pay==="tr"&&x.acr});
  var rep=mine.slice(0,-1).map(function(x){return {ts:x.ts,total:x.total,m:x.pay}});
  rep.push({ts:Date.now()-3600000,total:3400,m:"tr"});
  var used={},ok=[],solo=[];
  mine.forEach(function(x){var j=-1;for(var k=0;k<rep.length;k++){if(!used[k]&&rep[k].total===x.total){j=k;break}}if(j>-1){used[j]=1;ok.push(x)}else solo.push(x)});
  var sinsis=rep.filter(function(r,k){return !used[k]});
  return {ok:ok,solo:solo,sinsis:sinsis,n:rep.length};
}
function mpBlock(){
  var r=UI.mprep,pen=S.sales.filter(isPend).length;
  var head='<section class="card" style="margin-top:14px"><div class="head"><div><h3>Conciliación con Mercado Pago <span class="tag2">Simulado</span></h3><div class="note">Al cierre del día se sube el reporte de Mercado Pago y el sistema lo cruza con lo que los empleados marcaron como acreditado.</div></div><button class="ghost" data-a="mprep">Cargar reporte de ejemplo</button></div>';
  if(!r)return head+'<div class="note">Hoy hay '+pen+' transferencia'+(pen===1?"":"s")+' pendiente'+(pen===1?"":"s")+' de acreditar.</div></section>';
  return head+'<div class="kpis" style="margin-top:10px"><div class="kpi"><small>Coinciden</small><b class="num">'+r.ok.length+'</b></div><div class="kpi"><small>Marcadas y no están en Mercado Pago</small><b class="num" style="color:var(--bad)">'+r.solo.length+'</b></div><div class="kpi"><small>En Mercado Pago y sin venta cargada</small><b class="num" style="color:var(--warn)">'+r.sinsis.length+'</b></div></div>'
   +'<div class="tw"><table style="margin-top:8px"><tbody>'+r.solo.map(function(x){return '<tr><td>'+hhmm(x.ts)+'</td><td>'+x.emp+'</td><td class="r num">'+money(x.total)+'</td><td><span class="pill bad">Revisar: no figura en Mercado Pago</span></td></tr>'}).join("")+r.sinsis.map(function(x){return '<tr><td>'+hhmm(x.ts)+'</td><td>—</td><td class="r num">'+money(x.total)+'</td><td><span class="pill warn">Ingresó dinero sin venta cargada</span></td></tr>'}).join("")+'</tbody></table></div></section>';
}

function daysLeft(x){return 5-Math.round((startOfDay(0)-new Date(new Date(x.ts).getFullYear(),new Date(x.ts).getMonth(),new Date(x.ts).getDate()).getTime())/86400000)}
function fcfg(){if(!S.fcfg)S.fcfg={tipo:"C",pv:"0001",last:0,modo:"dia"};if(!S.fcfg.modo)S.fcfg.modo="dia";return S.fcfg}
function pad0(n,l){return String(n).padStart(l,"0")}
function feNum(f){return pad0(f.pv,4)+"-"+pad0(f.nro,8)}
function emitFe(x,rec){
  var c=fcfg();c.last++;var cae="";for(var i=0;i<14;i++)cae+=Math.floor(Math.random()*10);
  var v=new Date();v.setDate(v.getDate()+10);
  x.fe={tipo:c.tipo,pv:c.pv,nro:c.last,cae:cae,vto:v.getTime(),ts:Date.now(),fch:x.ts,rec:rec||null,by:(CUR&&CUR.name)||"Fernando",demo:true};x.facturada=true;return x.fe;
}
function fakeQr(seed){
  var n=25,h=0;for(var i=0;i<seed.length;i++)h=(h*31+seed.charCodeAt(i))>>>0;
  var r=function(){h=(h*1664525+1013904223)>>>0;return h>>>16&1};
  var f=function(x,y){return (x<8&&y<8)||(x>=n-8&&y<8)||(x<8&&y>=n-8)};
  var out='<svg viewBox="0 0 '+n+' '+n+'" width="96" height="96" aria-hidden="true"><rect width="'+n+'" height="'+n+'" fill="#fff"/>';
  for(var y=0;y<n;y++)for(var x=0;x<n;x++){if(!f(x,y)&&r())out+='<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="#222"/>'}
  [[0,0],[n-7,0],[0,n-7]].forEach(function(o){out+='<rect x="'+o[0]+'" y="'+o[1]+'" width="7" height="7" fill="#222"/><rect x="'+(o[0]+1)+'" y="'+(o[1]+1)+'" width="5" height="5" fill="#fff"/><rect x="'+(o[0]+2)+'" y="'+(o[1]+2)+'" width="3" height="3" fill="#222"/>'});
  return out+'</svg>';
}
function feGroups(list){
  var m={};list.forEach(function(x){var k=x.local+"|"+dayKey(x.ts);var g=m[k]=m[k]||{key:k,local:x.local,sales:[],total:0,pays:{}};g.sales.push(x);g.total+=x.total;g.pays[x.pay]=(g.pays[x.pay]||0)+x.total});
  return Object.keys(m).map(function(k){var g=m[k];g.sales.sort(function(a,b){return a.ts-b.ts});return g}).sort(function(a,b){return a.sales[0].ts-b.sales[0].ts});
}
function emitFeGroup(g){
  var f=emitFe(g.sales[0],null);f.g={n:g.sales.length,total:g.total,local:g.local,pays:g.pays};
  g.sales.forEach(function(x,i){if(i){x.fe=Object.assign({},f);x.facturada=true}});return f;
}
function feInvoices(){
  var m={};S.sales.forEach(function(x){if(!x.fe)return;var k=feNum(x.fe);var o=m[k]=m[k]||{fe:x.fe,sale:x,total:0,n:0};o.total+=x.total;o.n++});
  return Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){return b.fe.ts-a.fe.ts});
}
